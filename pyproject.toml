[project]
name = "xlerobot-grasp"
version = "0.1.0"
description = "XLeRobot grasping with GraspGenX, cuRobo v2 and MoveIt 2"
requires-python = "==3.12.*"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "viser",
    "loguru",
    "python-dotenv",
    "numpy==1.26.4",
    "trimesh",
    "yourdfpy",
    "torch==2.6.*",
    "torchvision==0.21.*",
    "graspgenx",
    "nvidia-curobo",
    "cuda-core[cu12]<1.0",
    # FastAPI's TestClient (used by the demos) needs the 0.x API.
    "httpx<1",
    "mujoco",
    "imageio[ffmpeg]",
    # Convex parts for object collision in MuJoCo (a single hull fills a banana's curve).
    "coacd>=1.0.7",
    "ultralytics>=8.4.173",
    "clip",
    "einops>=0.9.0.dev0",
]

[tool.uv]
package = false
prerelease = "allow"

[tool.uv.sources]
# GraspGenX and the cuRobo commit it was validated against (its end2end pin), both editable.
graspgenx = { path = "../../app/GraspGenX", editable = true }
nvidia-curobo = { path = "../../app/GraspGenX/ext/curobo", editable = true }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
clip = { git = "https://github.com/ultralytics/CLIP.git" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
